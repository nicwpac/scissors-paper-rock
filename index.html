<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1 id="title">Scissors, Paper, Rock!</h1>

    <div id="game-container">
        <div id="round-select">
            <label for="round-select-input">Select round amount</label>
            <input type="number" id="round-select-input"></input>
            <button id="start-game">Start Game</button>
        </div>

        <div id="choice-buttons">
            <button id="scissors-btn">Scissors</button>
            <button id="paper-btn">Paper</button>
            <button id="rock-btn">Rock</button>
        </div>

        <h2 id="round-counter"></h2>

        <div id="score">
            <p id="score-player">Your Score: 0</p>
            <p id="score-computer">Computer's Score: 0</p>
        </div>
        <div id="output"></div>
    </div>
</body>
</html>
